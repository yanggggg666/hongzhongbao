name: 激活辅助（一次性：RDP 登录 Cocos 账号）

# 用途：Cocos Creator 2.x 首次启动强制登录，CI 无法交互登录。
# 本流水线在 Windows runner 上开启远程桌面（RDP over bore 公网隧道，免注册免信用卡），
# 你在手机/电脑上远程连入，手动登录一次 Cocos 账号；
# 登录态档案（.CocosCreator）会被自动打包为 artifact cocos-profile，
# 之后「构建 Android APK」流水线会自动取用，全程无需手配 secret。
#
# 使用方法：
#   1. Actions → 激活辅助 → Run workflow
#   2. 等 2~4 分钟，在日志"打印 RDP 连接信息"步骤查看 地址/账号/密码
#   3. 用远程桌面连入，打开桌面上的 CocosCreator，登录 Cocos 账号
#   4. 出现编辑器主界面后可关闭编辑器；流水线检测到登录态自动打包

on:
  workflow_dispatch:
    inputs:
      wait_minutes:
        description: '等待登录的最长时间（分钟）'
        required: true
        default: '45'

env:
  CREATOR_URL: 'https://download.cocos.com/CocosCreator/v2.4.15/CocosCreator_v2.4.15_20250328_win.zip'

jobs:
  activate:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: 下载并解压 Cocos Creator 2.4.15
        shell: pwsh
        run: |
          curl.exe -L --retry 3 -sS -o creator.zip "$env:CREATOR_URL"
          Expand-Archive creator.zip -DestinationPath C:\CocosCreator -Force
          Write-Host "Creator 就绪"

      - name: 开启 RDP（设置密码/注册表/防火墙）
        shell: pwsh
        run: |
          $pwd = -join ((48..57) + (65..90) + (97..122) | Get-Random -Count 14 | ForEach-Object {[char]$_})
          $sec = ConvertTo-SecureString $pwd -AsPlainText -Force
          Set-LocalUser -Name "runneradmin" -Password $sec
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "远程桌面" -ErrorAction SilentlyContinue
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 1 -ErrorAction SilentlyContinue
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -ErrorAction SilentlyContinue
          echo "RDP_PASSWORD=$pwd" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "RDP 已开启"

      - name: 启动 Cocos Creator（使其弹出首个窗口）
        shell: pwsh
        run: |
          Start-Process -FilePath "C:\CocosCreator\CocosCreator.exe" -ArgumentList '--path "C:\CocosCreator" -nologin'
          Start-Sleep -Seconds 120
          Write-Host "编辑器已启动 2 分钟"

      - name: 截屏（诊断首启窗口）
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms,System.Drawing
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
          $bmp.Save("$PWD\screen.png")
          Write-Host "截屏已保存 ($($bounds.Width)x$($bounds.Height))"

      - uses: actions/upload-artifact@v4
        with:
          name: screenshot
          path: screen.png
          if-no-files-found: ignore

      - name: 启动 RDP 公网隧道并等待登录（bore，免注册免信用卡）
        shell: pwsh
        run: |
          curl.exe -L -sS -o bore.zip "https://github.com/ekzhang/bore/releases/download/v0.5.2/bore-v0.5.2-x86_64-pc-windows-msvc.zip"
          Expand-Archive bore.zip -DestinationPath C:\bore -Force
          $boreExe = Get-ChildItem "C:\bore\bore.exe" -Recurse | Select-Object -First 1 -ExpandProperty FullName
          if (-not $boreExe) { Write-Error "未找到 bore.exe"; exit 1 }
          $boreProc = Start-Process -FilePath $boreExe -ArgumentList "local 3389 --to bore.pub" -PassThru -WindowStyle Hidden -RedirectStandardOutput "$PWD\bore.log" -RedirectStandardError "$PWD\bore.err"
          $addr = $null
          for ($i=0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 2
            $c = (Get-Content "$PWD\bore.log" -Raw -ErrorAction SilentlyContinue) + (Get-Content "$PWD\bore.err" -Raw -ErrorAction SilentlyContinue)
            if ($c -match 'bore\.pub:(\d+)') { $addr = "bore.pub:$($Matches[1])"; break }
          }
          if (-not $addr) {
            Get-Content "$PWD\bore.log","$PWD\bore.err" -ErrorAction SilentlyContinue | Write-Host
            Write-Error "bore 隧道建立失败"; exit 1
          }
          Write-Host "==================================================="
          Write-Host "  RDP 连接信息（用手机/电脑的远程桌面客户端连接）"
          Write-Host "  地址:   $addr"
          Write-Host "  用户名: runneradmin"
          Write-Host "  密码:   $env:RDP_PASSWORD"
          Write-Host "==================================================="
          $deadline = (Get-Date).AddMinutes([int]"${{ inputs.wait_minutes }}")
          $userJson = "$env:USERPROFILE\.CocosCreator\user.json"
          $ok = $false
          while ((Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 20
            if ($boreProc.HasExited) {
              Write-Host "bore 进程已退出，打印日志："
              Get-Content "$PWD\bore.log","$PWD\bore.err" -ErrorAction SilentlyContinue
            }
            if (Test-Path $userJson) {
              $content = Get-Content $userJson -Raw -ErrorAction SilentlyContinue
              if ($content -and $content.Length -gt 50 -and ($content -match 'token|session|accessToken|uid')) {
                $ok = $true
                Write-Host "检测到登录态档案！"
                break
              }
            }
            Write-Host ("[{0:HH:mm:ss}] 等待登录中..." -f (Get-Date))
          }
          if (-not $ok) { Write-Error "超时未检测到登录态，请重新运行本流水线" }
          Start-Sleep -Seconds 30
          Get-Process CocosCreator -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 5
          Stop-Process -Id $boreProc.Id -Force -ErrorAction SilentlyContinue

      - name: 打包登录态档案并上传
        shell: pwsh
        run: |
          Compress-Archive -Path "$env:USERPROFILE\.CocosCreator\*" -DestinationPath "$PWD\cocos-profile.zip" -Force
          Write-Host "档案大小: $((Get-Item cocos-profile.zip).Length) 字节"

      - uses: actions/upload-artifact@v4
        with:
          name: cocos-profile
          path: cocos-profile.zip
          if-no-files-found: error
