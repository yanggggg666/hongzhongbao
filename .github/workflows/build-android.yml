name: 构建 Android APK

# 红中宝 Android 构建流水线（Cocos Creator 2.4.15，项目从 2.0.6 自动迁移）
#
# ⚠️ 前置条件（一次性，必须在仓库 Secrets 配置，见 docs/CI构建说明.md）：
#   COCOS_PROFILE_B64 —— 已登录 Cocos 账号的编辑器用户档案（base64 压缩包）
#   Cocos Creator 2.x 启动强制登录，CI 无法交互登录，需从已登录机器导出档案还原。
#
# 触发方式：Actions -> 构建 Android APK -> Run workflow

on:
  workflow_dispatch:
    inputs:
      ndk_version:
        description: 'NDK 版本（sdkmanager 格式）'
        required: true
        default: '21.4.7075529'
      api_level:
        description: 'Android API Level'
        required: true
        default: '28'

env:
  CREATOR_URL: 'https://download.cocos.com/CocosCreator/v2.4.15/CocosCreator_v2.4.15_20250328_win.zip'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: 下载 Cocos Creator 2.4.15（约 680MB）
        shell: pwsh
        run: |
          curl.exe -L --retry 3 -o creator.zip "$env:CREATOR_URL"
          if ((Get-Item creator.zip).Length -lt 600MB) { Write-Error "下载不完整"; exit 1 }

      - name: 解压 Cocos Creator
        shell: pwsh
        run: |
          Expand-Archive creator.zip -DestinationPath C:\CocosCreator -Force
          Get-ChildItem C:\CocosCreator | Select-Object -First 5

      - name: 获取 Cocos 编辑器登录档案
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 优先：仓库 Secret COCOS_PROFILE_B64；否则：自动从「激活辅助」流水线最近一次成功运行下载 cocos-profile 产物
          if ("${{ secrets.COCOS_PROFILE_B64 }}" -ne "") {
            Write-Host "使用 COCOS_PROFILE_B64 secret"
            $bytes = [Convert]::FromBase64String("${{ secrets.COCOS_PROFILE_B64 }}")
            [IO.File]::WriteAllBytes("$PWD\profile.zip", $bytes)
          } else {
            Write-Host "未配 secret，尝试从 activation artifact 下载"
            $runs = gh run list --workflow=setup-activation.yml --status=success --limit=5 --json databaseId,createdAt | ConvertFrom-Json
            if (-not $runs) { Write-Error "找不到成功的「激活辅助」运行记录，请先跑一次（填 ngrok authtoken）"; exit 1 }
            foreach ($r in $runs) {
              gh run download $r.databaseId --name cocos-profile --dir "$PWD\pf" 2>$null
              if (Test-Path "$PWD\pf\cocos-profile.zip") { Copy-Item "$PWD\pf\cocos-profile.zip" "$PWD\profile.zip"; break }
            }
            if (-not (Test-Path "$PWD\profile.zip")) { Write-Error "「激活辅助」产物中无 cocos-profile.zip（可能未填 ngrok token 跑过）"; exit 1 }
          }
          Expand-Archive profile.zip -DestinationPath "$env:USERPROFILE\.CocosCreator" -Force
          Write-Host "登录档案已还原到 $env:USERPROFILE\.CocosCreator"

      - name: 安装 Android SDK 组件与 NDK（sdkmanager 需 Java 17）
        shell: pwsh
        run: |
          # 新版 sdkmanager 要求 Java 17+（gradle 编译阶段才用 JDK 8，见后续步骤）
          $env:JAVA_HOME = $env:JAVA_HOME_17_X64
          $env:Path = "$env:JAVA_HOME\bin;$env:Path"
          $sdk = "$env:ANDROID_SDK_ROOT"
          Write-Host "SDK 目录: $sdk"
          $sdkmgr = "$sdk\cmdline-tools\latest\bin\sdkmanager.bat"
          if (-not (Test-Path $sdkmgr)) {
            $sdkmgr = (Get-ChildItem "$sdk\cmdline-tools\*\bin\sdkmanager.bat" | Select-Object -First 1).FullName
          }
          Write-Host "sdkmanager: $sdkmgr"
          cmd /c "echo y| `"$sdkmgr`" --sdk_root=`"$sdk`" --licenses >NUL"
          & $sdkmgr --sdk_root="$sdk" --install "platforms;android-${{ inputs.api_level }}" "build-tools;28.0.3" "ndk;${{ inputs.ndk_version }}"
          if ($LASTEXITCODE -ne 0) { Write-Error "sdkmanager install failed: $LASTEXITCODE" }
          $ndk = "$sdk\ndk\${{ inputs.ndk_version }}"
          if (-not (Test-Path "$ndk\ndk-build.cmd")) { Write-Error "NDK 未安装成功: $ndk" }
          echo "ANDROID_NDK_HOME=$ndk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "NDK_ROOT=$ndk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "ANDROID_NDK_ROOT=$ndk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: 切回 JDK 8（gradle/AGP 3.x 编译需要）
        shell: pwsh
        run: |
          echo "JAVA_HOME=$env:JAVA_HOME_8_X64" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "已选 JDK: $env:JAVA_HOME_8_X64"

      - name: 命令行构建 Android（实时输出编辑器日志）
        shell: pwsh
        run: |
          $logDir = "$env:USERPROFILE\.CocosCreator\logs"
          $proc = Start-Process -FilePath "C:\CocosCreator\CocosCreator.exe" `
            -ArgumentList '--path', "`"$PWD\client`"", '--build', '"platform=android;debug=true;autoCompile=true;apiLevel=${{ inputs.api_level }};appABIs=[''armeabi-v7a'']"' `
            -PassThru
          $deadline = (Get-Date).AddMinutes(45)
          $lastSize = @{}
          $startTime = Get-Date
          while (-not $proc.HasExited -and (Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 30
            # 输出编辑器日志增量，便于诊断卡点
            if (Test-Path $logDir) {
              Get-ChildItem "$logDir\*.log" -ErrorAction SilentlyContinue | ForEach-Object {
                $size = (Get-Item $_.FullName).Length
                $prev = $lastSize[$_.FullName]; if ($null -eq $prev) { $prev = 0 }
                if ($size -gt $prev) {
                  Write-Host "---- [$($_.Name) +$($size-$prev)B] ----"
                  Get-Content $_.FullName -Tail 8 -ErrorAction SilentlyContinue
                  $lastSize[$_.FullName] = $size
                }
              }
            }
            Write-Host ("[{0:HH:mm:ss}] 构建中... client\build 存在: {1}" -f (Get-Date), (Test-Path "$PWD\client\build"))
            # 自动点掉 Cocos 的「项目升级确认」弹窗：BM_CLICK 直接给按钮发消息
            try {
              if (-not ('CocosClick' -as [type])) {
                Add-Type -TypeDefinition 'using System; using System.Runtime.InteropServices; using System.Text; public delegate bool EnumWindowsProc(IntPtr hWnd, IntPtr lParam); public class CocosClick { [DllImport("user32.dll",SetLastError=true,CharSet=CharSet.Unicode)] public static extern IntPtr FindWindow(string lpClassName, string lpWindowName); [DllImport("user32.dll",SetLastError=true)] public static extern bool EnumChildWindows(IntPtr hWndParent, EnumWindowsProc lpfnEnumProc, IntPtr lParam); [DllImport("user32.dll",SetLastError=true,CharSet=CharSet.Unicode)] public static extern int GetWindowText(IntPtr hWnd, StringBuilder lpString, int nMaxCount); [DllImport("user32.dll",SetLastError=true)] public static extern IntPtr SendMessage(IntPtr hWnd, int Msg, IntPtr wParam, IntPtr lParam); static EnumWindowsProc _cb; public static void ClickConfirm(){ _cb = new EnumWindowsProc((hW, lp) => { var sb = new StringBuilder(256); GetWindowText(hW, sb, sb.Capacity); if (sb.ToString() == "Confirm") { SendMessage(hW, 0x00F5, IntPtr.Zero, IntPtr.Zero); return false; } return true; }); IntPtr hwnd = FindWindow(null, "CocosCreator.exe"); if (hwnd != IntPtr.Zero) EnumChildWindows(hwnd, _cb, IntPtr.Zero); } }'
              }
              [CocosClick]::ClickConfirm()
              Write-Host "已发送 BM_CLICK Confirm"
            } catch {}
            # 再用坐标点击兜底
            try {
              if (-not ('Win32Click' -as [type])) {
                Add-Type -TypeDefinition 'using System; using System.Runtime.InteropServices; public class Win32Click { [DllImport("user32.dll",SetLastError=true)] public static extern bool SetCursorPos(int X,int Y); [DllImport("user32.dll",SetLastError=true)] public static extern void mouse_event(int flags,int dx,int dy,int data,int extraInfo); public static void Click(int x,int y){ SetCursorPos(x,y); mouse_event(0x02,0,0,0,0); mouse_event(0x04,0,0,0,0); } }'
              }
              [Win32Click]::Click(652,394)
              Write-Host "已模拟点击 Confirm"
            } catch {}
            # 周期性截屏，用于诊断编辑器是否弹窗卡住
            try {
              Add-Type -AssemblyName System.Windows.Forms,System.Drawing
              $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
              $bmp = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
              $g = [System.Drawing.Graphics]::FromImage($bmp)
              $g.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
              $stamp = (Get-Date -Format 'HHmmss')
              $bmp.Save("$PWD\buildscreen_$stamp.png")
              $bmp.Dispose(); $g.Dispose()
            } catch {}
            # 卡死检测：启动 5 分钟后编辑器 logs 目录仍无任何日志 → 多半卡在登录窗口/崩溃，直接失败
            if (((Get-Date) - $startTime).TotalMinutes -gt 5 -and ((Get-ChildItem "$logDir\*.log" -ErrorAction SilentlyContinue | Measure-Object).Count -eq 0)) {
              Write-Host "编辑器 5 分钟内未产生任何日志，判定启动卡死，终止构建"
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
              exit 1
            }
          }
          if (-not $proc.HasExited) {
            Write-Host "构建超时(45分钟)，输出诊断信息："
            Get-ChildItem "$env:USERPROFILE\.CocosCreator" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 20 FullName
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            exit 1
          }
          Write-Host "构建进程退出码: $($proc.ExitCode)"

      - name: 查找并上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: hongzhongbao-apk
          path: |
            client/build/**/*.apk
          if-no-files-found: error

      - name: 失败时上传编辑器日志与构建截屏（诊断用）
        if: failure()
        shell: pwsh
        run: |
          $dest = "$PWD\ci-logs"
          New-Item -ItemType Directory -Force $dest | Out-Null
          Copy-Item "C:/Users/runneradmin/.CocosCreator/logs/*" $dest -Force -ErrorAction SilentlyContinue
          Copy-Item "$PWD\buildscreen_*.png" $dest -Force -ErrorAction SilentlyContinue
          Write-Host (Get-ChildItem $dest | ForEach-Object Name)

      - name: 归档诊断产物
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: creator-logs
          path: ci-logs/**
